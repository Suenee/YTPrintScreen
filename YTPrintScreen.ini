; YTPrintScreen.ini
; Konfigurace skriptu YTPrintScreen.ahk
; Hodnoty v profilech přepisují stejnojmenné hodnoty ze sekce [Common].

[Profiles]
Order="YouTube,ChatGPT,QuickN,VLC"               ; Pořadí profilů pro automatické rozpoznání cílového okna

[Targets]
Chrome="chrome.exe"                              ; Google Chrome
Brave="brave.exe"                                ; Brave
VLC="vlc.exe"                                    ; VLC media player
;Edge="msedge.exe"                               ; Microsoft Edge - odkomentovat pro povolení
;Firefox="firefox.exe"                           ; Mozilla Firefox - odkomentovat pro povolení

[Common]
DebugMode="single"                               ; Logování: "off"=vypnuto, "single"=aktuální běh, "all"=historie všech běhů
LogFile="logs\YTPrintScreen.log"                ; Cesta k logu relativně k adresáři skriptu

ActivationWait=300                               ; Čekání po aktivaci cílového okna v milisekundách
ActivationTimeout=2000                           ; Maximální čekání na aktivaci cílového okna v milisekundách
FullscreenWait=1200                              ; Čekání po změně fullscreen režimu v milisekundách
HideControlsWait=4000                            ; Čekání na zmizení ovládacích prvků v milisekundách
ClipboardWait=300                                ; Čekání na data ve schránce v milisekundách
PowerPointWait=300                               ; Čekání po aktivaci PowerPointu v milisekundách

HideMouseOffsetX=20                              ; Vodorovná pozice kurzoru od levého okraje cílového okna
HideMouseOffsetY=20                              ; Svislá pozice kurzoru od horního okraje cílového okna

FullscreenKey="{F11}"                            ; Výchozí klávesa pro přepnutí fullscreen režimu
AutoFullscreen=0                                 ; Automatické přepnutí do fullscreen: 0=vypnuto, 1=zapnuto

DefaultPipeline="Fullscreen"                     ; Výchozí pipeline při běžném spuštění
CapturePipeline="FSCUT"                          ; Pipeline použitá příkazem capture/fscut

FSCUT_Ratio="16:9"                               ; Poměr stran výřezu šířka:výška; lze použít desetinnou tečku i čárku
FSCUT_X=195                                      ; Levý okraj pevného výřezu v pixelech
FSCUT_Y=110                                      ; Horní okraj pevného výřezu v pixelech
FSCUT_W=1533                                     ; Šířka pevného výřezu v pixelech; výška se dopočítá z FSCUT_Ratio

Output="PowerPoint"                              ; Cíl výstupu: "PowerPoint" nebo "File"
FileFormat="PNG"                                 ; Formát souborového výstupu: PNG nebo JPG

PowerPointAutoSlide=1                            ; Automatické vytvoření nového slidu: 0=vypnuto, 1=zapnuto
PowerPointPosition="Fullscreen"                  ; Výchozí pozice obrázku v PowerPointu

[YouTube]
MatchTitle="(?i)YouTube"                         ; Regulární výraz porovnávaný s titulkem okna
FullscreenKey="f"                                ; Klávesa fullscreen přehrávače YouTube
AutoFullscreen=1                                 ; Pro YouTube automaticky zapnout fullscreen

[ChatGPT]
MatchURL="(?i)^(https?://)?(www\.)?chatgpt\.com(?:/|$)" ; Regulární výraz pro rozpoznání ChatGPT podle URL
AutoFullscreen=1                                 ; Pro ChatGPT automaticky zapnout fullscreen
FSCUT_X=253                                      ; Levý okraj výřezu pro ChatGPT v pixelech
FSCUT_Y=130                                      ; Horní okraj výřezu pro ChatGPT v pixelech
FSCUT_W=1465                                     ; Šířka výřezu pro ChatGPT v pixelech
AutoTrimTolerance=3                              ; Tolerance detekce okrajů pro AutoTrim/SmartTrim v procentech
CapturePipeline="FSCUT"                          ; Pipeline pro capture/fscut v profilu ChatGPT
PowerPointAutoSlide=1                            ; Pro ChatGPT automaticky vytvořit nový slide

[QuickN]
MatchURL="(?i)^(https?://)?(www\.)?(quickn\.quickbreaknews\.com|tasty\.ezyfoodies\.com)(?:/|$)" ; Rozpoznání podporovaných QuickN webů podle URL
FullscreenKey="f"                                ; Klávesa fullscreen videopřehrávače
AutoFullscreen=0                                 ; Automatické přepnutí videa do fullscreen
DefaultPipeline="FSCUT"                          ; Pipeline při běžném spuštění pro QuickN
CapturePipeline="FSCUT"                          ; Pipeline pro capture/fscut v profilu QuickN
AutoTrimTolerance=3                              ; Tolerance detekce okrajů pro AutoTrim/SmartTrim v procentech
PowerPointAutoSlide=0                            ; Nevytvářet automaticky nový slide
PowerPointPosition="SizeRight"                   ; Použít pozici PowerPointu definovanou níže
FSCUT_Ratio="2,39:1"                             ; Poměr stran filmového obrazu
FSCUT_X=0                                        ; Levý okraj výřezu v pixelech
FSCUT_Y=139                                      ; Horní okraj výřezu v pixelech
FSCUT_W=1920                                     ; Šířka výřezu v pixelech

[Position:SizeRight]
Left=17.13                                       ; Levá pozice obrázku na slidu v centimetrech
Top=3.32                                         ; Horní pozice obrázku na slidu v centimetrech
MaxWidth=13.7                                    ; Maximální šířka obrázku v centimetrech
MaxHeight=13.8                                   ; Maximální výška obrázku v centimetrech
PositionTolerance=0.2                            ; Tolerance při rozpoznání existující pozice v centimetrech
StackGap=0.3                                     ; Mezera mezi skládanými obrázky v centimetrech

[VLC]
MatchTitle="(?i)VLC media player"                ; Regulární výraz porovnávaný s titulkem VLC
FullscreenKey="f"                                ; Klávesa fullscreen ve VLC
AutoFullscreen=0                                 ; Automatické přepnutí VLC do fullscreen

[Others]
FullscreenKey="{F11}"                            ; Klávesa použitá, pokud neodpovídá žádný konkrétní profil
AutoFullscreen=0                                 ; Ostatní cíle nepřepínat automaticky do fullscreen

; YTPrintScreen.ini
; Konfigurace skriptu YTPrintScreen.ahk

[Profiles]
Order="YouTube,ChatGPT,QuickN,VLC"                  ; Profily pro automatický výběr; aktivní povolené okno má stejně přednost

[Targets]
Chrome="chrome.exe"                             ; Google Chrome
Brave="brave.exe"                               ; Brave
VLC="vlc.exe"                                   ; VLC media player
;Edge="msedge.exe"                              ; Microsoft Edge
;Firefox="firefox.exe"                          ; Mozilla Firefox


[Common]
DebugMode="single"                              ; Režim logování: "off", "single" nebo "all"
LogFile="YTPrintScreen.log"                     ; Název logovacího souboru v adresáři skriptu

ActivationWait=300                              ; Čekání po aktivaci cílového okna v milisekundách
ActivationTimeout=2000                          ; Maximální čekání na aktivaci cílového okna v milisekundách
FullscreenWait=1200                             ; Čekání po změně fullscreen režimu v milisekundách
HideControlsWait=4000                           ; Čekání na zmizení ovládacích prvků v milisekundách
ClipboardWait=300                               ; Čekání po screenshotu před vložením do PowerPointu v milisekundách
PowerPointWait=300                              ; Čekání po aktivaci PowerPointu před vložením obrázku v milisekundách

HideMouseOffsetX=20                             ; Vodorovná pozice kurzoru od levého okraje cílového okna
HideMouseOffsetY=20                             ; Svislá pozice kurzoru od horního okraje cílového okna

FullscreenKey="{F11}"                           ; Výchozí klávesa pro zapnutí a vypnutí fullscreen režimu
AutoFullscreen=0                                ; Výchozí stav automatického fullscreen režimu: 0=vypnuto, 1=zapnuto

DefaultPipeline="Fullscreen"                    ; Pipeline při spuštění bez parametru
CapturePipeline="FSCUT"                         ; Pipeline pro parametr capture; fscut je kompatibilní alias

FSCUT_Ratio="16:9"                                ; Poměr stran výřezu šířka:výška; desetinná tečka i čárka jsou povoleny, např. "2,39:1"
FSCUT_X=195                                     ; Pozice levého okraje výřezu ve FullHD obrazu
FSCUT_Y=110                                     ; Pozice horního okraje výřezu ve FullHD obrazu
FSCUT_W=1533                                    ; Šířka výřezu, výška se dopočítá automaticky v poměru 16:9

Output="PowerPoint"                             ; Cíl výstupu: "PowerPoint" nebo "File"
FileFormat="PNG"                                ; Výchozí formát při Output="File": "PNG", "JPG" nebo "JPEG"

PowerPointAutoSlide=1                           ; 1 = vložit na čistý slide / případně vytvořit nový, 0 = vložit do aktuálního slidu
PowerPointPosition="Fullscreen"                 ; Pozice obrázku v PowerPointu: "Fullscreen" nebo název sekce [Position:<název>]


[YouTube]
MatchTitle="(?i)YouTube"                        ; Regulární výraz porovnávaný s titulkem okna
FullscreenKey="f"                               ; Klávesa fullscreen přehrávače YouTube
AutoFullscreen=1                                ; Pro YouTube se fullscreen automaticky zapne


[ChatGPT]
MatchURL="(?i)^(https?://)?(www\.)?chatgpt\.com(?:/|$)" ; Regulární výraz pro ChatGPT; funguje s protokolem i bez něj
AutoFullscreen=1                                ; Pro ChatGPT se fullscreen automaticky zapne
FSCUT_X=430                                     ; Pozice levého okraje výřezu pro ChatGPT
FSCUT_Y=119                                     ; Pozice horního okraje výřezu pro ChatGPT
FSCUT_W=1220                                    ; Šířka výřezu pro ChatGPT, výška se dopočítá automaticky v poměru 16:9
AutoTrimTolerance=3                              ; Barevná tolerance inteligentního trimu v procentech; >0 zapnuto
CapturePipeline="SmartTrim,FSCUTFallback"        ; Nejprve SmartTrim nad fullscreenem, při nejistotě pevný FSCUT


[QuickN]
MatchURL="(?i)^(https?://)?(www\.)?(quickn\.quickbreaknews\.com|tasty\.ezyfoodies\.com)(?:/|$)" ; Obě používané domény QuickN
FullscreenKey="f"                               ; Fullscreen videopřehrávače pomocí klávesy F
AutoFullscreen=0                                ; Automaticky přepnout video do fullscreen
DefaultPipeline="SmartTrim,FSCUTFallback"        ; I bez parametru nejprve SmartTrim, při nejistotě pevný FSCUT
CapturePipeline="SmartTrim,FSCUTFallback"        ; Stejné zpracování pro capture / legacy fscut
AutoTrimTolerance=3                              ; Barevná tolerance inteligentního trimu v procentech

PowerPointAutoSlide=0                           ; Vložit screenshot do aktuálního slidu bez zakládání čistého slidu
PowerPointPosition="SizeRight"                  ; Použít pozici definovanou v [Position:SizeRight]

FSCUT_Ratio="2,39:1"                            ; Poměr stran samotného filmového obrazu
FSCUT_X=1                                       ; Prakticky celý obraz od levého okraje
FSCUT_Y=139                                     ; Odhad horního okraje obrazu při fullscreen videu
FSCUT_W=1920                                    ; Prakticky celá šířka FullHD, výška se dopočítá


[Position:SizeRight]
Left=17.13                                    ; Levý okraj cílové oblasti v cm
Top=3.32                                      ; Horní okraj cílové oblasti v cm
MaxWidth=13.7                                 ; Maximální šířka obrázku v cm
MaxHeight=13.8                                ; Maximální výška obrázku v cm
PositionTolerance=0.2                           ; Tolerance v cm pro hledání objektů v cílové pozici, 0 = vypnuto
StackGap=0.3                                  ; Svislá mezera mezi obrázky při skládání pod sebe v cm


[VLC]
MatchTitle="(?i)VLC media player"               ; Volitelné upřesnění při více oknech VLC; při --profile:VLC není Match* povinné
FullscreenKey="f"                               ; Výchozí klávesa fullscreen ve VLC
AutoFullscreen=0                                ; Fullscreen se bez explicitního požadavku nemění


[Others]
FullscreenKey="{F11}"                           ; Hodnota použitá, pokud neodpovídá žádný profil
AutoFullscreen=0                                ; Ostatní stránky zůstávají bez automatického fullscreen režimu

name: Apply PowerPoint paste fix

on:
  push:
    branches: [devel]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply PowerPoint paste fix workflow'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devel
          fetch-depth: 0

      - name: Patch YTPrintScreen
        shell: pwsh
        run: |
          $path = 'YTPrintScreen.ahk'
          $text = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
          $text = $text.Replace('Aktuální verze: 1.95', 'Aktuální verze: 1.97')
          $old = @'
                  shape_range := slide.Shapes.PasteSpecial(1)
                  shape := shape_range.Item(1)
          '@
          $new = @'
                  ; Clipboard obsahuje nativní CF_BITMAP. Obyčejný Paste nechá PowerPoint
                  ; zvolit skutečně dostupný obrazový formát; PasteSpecial(1) může na
                  ; některých verzích Office odmítnout platnou bitmapu jako nedostupný typ.
                  Log("PowerPoint paste | Method=Paste | START")
                  try {
                      shape_range := slide.Shapes.Paste()
                      shape := shape_range.Item(1)
                      Log("PowerPoint paste | Method=Paste | SUCCESS")
                  } catch as paste_error {
                      Log("PowerPoint paste | Method=Paste | FAILED | Detail=" paste_error.Message)
                      Log("PowerPoint paste | Method=PasteSpecial(1) | FALLBACK START")
                      shape_range := slide.Shapes.PasteSpecial(1)
                      shape := shape_range.Item(1)
                      Log("PowerPoint paste | Method=PasteSpecial(1) | FALLBACK SUCCESS")
                  }
          '@
          if (-not $text.Contains($old)) { throw 'Target PasteSpecial block was not found.' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($true)))

          $changelog = 'YTPrintScreen_CHANGELOG.md'
          $change = @'
          ## 1.97
          - Opraveno vkládání screenshotu do PowerPointu, které mohlo selhat chybou `Shapes.PasteSpecial: The specified data type is unavailable`, přestože PowerPoint běžel a bitmapa byla správně ve schránce.
          - Primární metoda je nyní `Shapes.Paste()`, takže PowerPoint sám použije dostupný obrazový formát z clipboardu.
          - Původní `PasteSpecial(1)` zůstává pouze jako fallback pro případ selhání běžného vložení.
          - Log nově zapisuje použitou PowerPoint paste metodu, úspěch a případný přechod na fallback.

          '@
          $oldChange = [IO.File]::ReadAllText($changelog, [Text.Encoding]::UTF8)
          if ($oldChange -notmatch '(?m)^## 1\.97\s*$') {
              $oldChange = $oldChange -replace '(?m)^(# YTPrintScreen . CHANGELOG\r?\n\r?\n)', ('$1' + $change)
              [IO.File]::WriteAllText($changelog, $oldChange, (New-Object Text.UTF8Encoding($true)))
          }

          Remove-Item '.github/workflows/apply-powerpoint-paste-fix.yml' -Force

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add YTPrintScreen.ahk YTPrintScreen_CHANGELOG.md .github/workflows/apply-powerpoint-paste-fix.yml
          git commit -m 'YTPrintScreen 1.97: robust PowerPoint image paste'
          git push origin HEAD:devel
